name: Veracode_PR

'on':
  push:
    branches-ignore: ['veracode-fix/**', 'Veracode-fix-bot-**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  Package:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Package application files
        uses: thedoctor0/zip-release@master
        with:
          filename: veracode.zip
          path: .
          exclusions: '*.git* /*node_modules/*'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacoteVeracode
          path: veracode.zip

  Veracode_SCA:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Diagnose Maven dependencies
        working-directory: ./app
        run: |
          java -version
          mvn -version
          mvn -B -e dependency:tree
      - name: Veracode SCA
        working-directory: ./app
        env:
          SRCCLR_API_TOKEN: ${{ secrets.SCA }}
        run: |
          curl -fsSL https://download.sourceclear.com/ci.sh | bash -s -- scan \
            --loud --update-advisor --allow-dirty --json="$RUNNER_TEMP/sca-results.json"

      - name: Veracode Fix for SCA
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          VERACODE_API_KEY_ID: ${{ secrets.VeracodeID }}
          VERACODE_API_KEY_SECRET: ${{ secrets.VeracodeKey }}
        run: |
          mkdir -p "$RUNNER_TEMP/veracode-cli"
          cd "$RUNNER_TEMP/veracode-cli"
          curl -fsSL https://tools.veracode.com/veracode-cli/install | sh
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/veracode-cli/veracode" fix sca "$GITHUB_WORKSPACE/app" \
            --results "$RUNNER_TEMP/sca-results.json" --remote

      - name: Create SCA fixes pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-pull-request@v7
        with:
          base: ${{ github.head_ref }}
          branch: veracode-fix/sca-pr-${{ github.event.pull_request.number }}
          title: 'Veracode SCA fixes for PR #${{ github.event.pull_request.number }}'
          commit-message: 'fix: resolve Veracode SCA findings'
          body: 'Review the dependency and source changes generated by Veracode Fix for SCA.'

  Veracode_PipelineScan:
    runs-on: ubuntu-latest
    needs: Package
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pacoteVeracode
          path: ${{ runner.temp }}/package
      - name: Veracode Pipeline Scan
        continue-on-error: true
        env:
          VID: ${{ secrets.VeracodeID }}
          VKEY: ${{ secrets.VeracodeKey }}
        run: |
          curl -fsSL https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip \
            -o "$RUNNER_TEMP/pipeline-scan.zip"
          unzip -o "$RUNNER_TEMP/pipeline-scan.zip" pipeline-scan.jar -d "$RUNNER_TEMP"
          java -jar "$RUNNER_TEMP/pipeline-scan.jar" \
            -vid "$VID" -vkey "$VKEY" -f "$RUNNER_TEMP/package/veracode.zip" \
            --issue_details true -esd true --json_output true --json_output_file results.json

      - name: Veracode Fix for SAST
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('results.json') != ''
        uses: veracode/veracode-fix@main
        with:
          vid: ${{ secrets.VeracodeID }}
          vkey: ${{ secrets.VeracodeKey }}
          token: ${{ github.token }}
          inputFile: results.json
          fixType: batch
          files: changed
          prComment: 'true'
          createPR: 'true'